    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#eed7a2"/><stop offset="1" stop-color="#ad8951"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5b8d1" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#445064" stroke-opacity=".7"/>
