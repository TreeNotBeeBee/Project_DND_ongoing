<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">JigeRPG — 本机保存世界，与伙伴同步冒险</title>
  <desc id="description">暗蓝与金色的 JigeRPG 品牌横幅，左侧为原创二十面骰几何图案，右侧为抽象网格棋盘。Windows x64 开发预览版，规则基准为 SRD 5.2.1。</desc>
